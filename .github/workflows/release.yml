name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  PIXI_LOCKED: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.83.0
          environments: dev
          locked: true

      - name: Build distribution
        run: pixi run -e dev build-dist

      - name: Check distribution
        run: pixi run -e dev check-dist

      - name: Check artifact versions against release tag
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: pixi run -e dev check-release "$RELEASE_VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
