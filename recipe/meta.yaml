{% set name = "prefect-submitit" %}
{% set project = load_file_data('../pyproject.toml', from_recipe_dir=True) %}
{% set version = project['project']['version'] %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9034776e6e62e38e49c133cf4c4ae1f0629cf1c2c649a01983c47b9b85e72c19

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - hatchling
  run:
    - python >=3.12
    - prefect >=3.0
    - submitit >=1.5
    - cloudpickle >=3.0

test:
  imports:
    - prefect_submitit
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/dexterity-systems/prefect-submitit
  summary: A Prefect 3 TaskRunner that submits tasks to SLURM clusters via submitit
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/dexterity-systems/prefect-submitit

extra:
  recipe-maintainers:
    # Add your GitHub username here
    - andrewcolinhunt
    - anantmittal
